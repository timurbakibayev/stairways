name: Deploy stairways
on:
  push: { branches: ["main"] }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: appleboy/ssh-action@master
        with:
          host: artur.commit.kz
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: /var/www/stairways/update.sh
